<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>今日おなにーした？</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      padding-top: 60px;
      background-color: #f5f7fa;
      transition: background-color 0.3s;
    }
    h1 {
      font-size: 32px;
    }
    #date {
      color: #666;
      margin-bottom: 30px;
    }
    button {
      font-size: 24px;
      padding: 15px 30px;
      border: none;
      border-radius: 12px;
      background-color: #4caf50;
      color: white;
    }
    #result {
      margin-top: 25px;
      font-size: 20px;
    }
    .done {
      background-color: #e0ffe0;
    }
  </style>
</head>

<body>
  <h1>今日オナニーした？</h1>
  <div id="date"></div>
  <div id="streak"></div>
  <div id="date"></div>

  <button onclick="done()">した！</button>
  <div id="result"></div>

 <script>
  // 今日の日付を用意
  const today = new Date();
  const todayStr = today.toDateString();

  // 日付を画面に表示
  document.getElementById("date").textContent =
    today.toLocaleDateString();

  // 保存されている値を読む
  let streak = Number(localStorage.getItem("streak")) || 0;
  const lastDone = localStorage.getItem("lastDone");

  // すでに今日やってたら表示
  if (lastDone === todayStr) {
    showDone();
  }

  // ボタンを押した時
  function done() {
    if (lastDone) {
      const last = new Date(lastDone);
      const diff =
        (today - last) / (1000 * 60 * 60 * 24);

      if (diff < 1.5) {
        // 同じ日 → 何もしない
      } else if (diff < 2.5) {
        // 連続
        streak++;
      } else {
        // 途切れた
        streak = 1;
      }
    } else {
      // 初回
      streak = 1;
    }

    // 保存
    localStorage.setItem("streak", streak);
    localStorage.setItem("lastDone", todayStr);

    showDone();
  }

  // 表示する処理
  function showDone() {
    document.getElementById("result").textContent =
      "今日はやった！🎉";
    document.getElementById("streak").textContent =
      `🔥 ${streak}日連続！`;
  }
</script>
  
</body>
</html>
