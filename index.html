<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>今日おなにーした？</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      padding-top: 60px;
      background-color: #f5f7fa;
      transition: background-color 0.3s;
    }
    h1 {
      font-size: 32px;
    }
    #date {
      color: #666;
      margin-bottom: 30px;
    }
    button {
      font-size: 24px;
      padding: 15px 30px;
      border: none;
      border-radius: 12px;
      background-color: #4caf50;
      color: white;
    }
    #result {
      margin-top: 25px;
      font-size: 20px;
    }
    .done {
      background-color: #e0ffe0;
    }
  </style>
</head>

<body>
  <h1>今日オナニーした？</h1>
  <div id="date"></div>

  <button onclick="done()">した！</button>
  <div id="result"></div>

  <script>
    const today = new Date().toDateString();

    // 日付表示
    document.getElementById("date").textContent =
      new Date().toLocaleDateString();

    // すでにやってた場合
    if (localStorage.getItem("done") === today) {
      showDone();
    }

    function done() {
      localStorage.setItem("done", today);
      showDone();
    }

    function showDone() {
      document.getElementById("result").textContent = "今日はやった！🎉";
      document.body.classList.add("done");
    }
  </script>
</body>
</html>
